# Always use the compose file from the current release:
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
# Main branch may not match the latest release.
#Basic Docker Compose for my Unraid Setup. Will need to test and update per my chase and zpool

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Photo upload storage
      #Changed this location to use the unraid share that will push from cashe to array or zpool
      - immich-photos:/mnt/usr/immich/upload 
      # Original - immich-photos:/usr/src/app/upload
      #mount another folder location (as read only) of previous pictures from another share
      #/mnt/photos:/mnt/photos:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
    networks:
      immich-net:
        ipv4_address: 172.19.0.10
    labels:
      net.unraid.docker.icon: 'https://raw.githubusercontent.com/imagegenius/templates/main/unraid/img/immich.png'
      net.unraid.docker.webui: http://[IP]:[PORT:2283]
      folder.view: immich
      net.unraid.docker.managed: 'composeman'

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false
    networks:
      immich-net:
        ipv4_address: 172.19.0.11
    labels:
      net.unraid.docker.icon: 'https://raw.githubusercontent.com/imagegenius/templates/main/unraid/img/immich.png'
      folder.view: immich
      net.unraid.docker.managed: 'composeman'

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:ff21bc0f8194dc9c105b769aeabf9585fea6a8ed649c0781caeac5cb3c247884
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      immich-net:
        ipv4_address: 172.19.0.12
    labels:
      net.unraid.docker.icon: 'https://raw.githubusercontent.com/A75G/docker-templates/master/templates/icons/redis.png'
      folder.view: immich
      net.unraid.docker.managed: 'composeman'

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    restart: always
    networks:
      immich-net:
        ipv4_address: 172.19.0.13
    labels:
      #original link didnt work for icon: https://raw.githubusercontent.com/A75G/docker-templates/master/templates/icons/postgres.png needs to be updated. 
      net.unraid.docker.icon: 'https://raw.githubusercontent.com/bmartino1/unraid-docker-templates/refs/heads/main/images/postgresql-immich-logo.png'
      folder.view: immich
      net.unraid.docker.managed: 'composeman'

networks:
  immich-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1

volumes:
  model-cache:
    driver: local
    driver_opts:
      type: none
      device: /mnt/user/appdata_immich/immich/config
      o: bind

  immich-photos:
    driver: local
    driver_opts:
      type: none
      #changeup the path for my unraid setup with secondary cashe drives and zpool
      device: /mnt/user/appdata_immich/immich/photos
      o: bind

  postgres-data:
    driver: local
    driver_opts:
      type: none
      #changeup the path for my unraid setup with secondary cashe drives and zpool
      device: /mnt/user/appdata_immich/immich/database/postgres
      o: bind

  redis-data:
    driver: local
    driver_opts:
      type: none
      #changeup the path for my unraid setup with secondary cashe drives and zpool
      device: /mnt/user/appdata_immich/immich/database/redis
      o: bind
