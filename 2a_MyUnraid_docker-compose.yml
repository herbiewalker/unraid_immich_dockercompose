# Always use the compose file from the current release:
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
# Main branch may not match the latest release.
# The updated Docker Compose for my Unraid Setup which includes GPU for transcode and ML. Will need to test and update per my cache and zpool

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # Extends are taken out and the file: hwaccel.transcoding.yml info for nvenc/nvidia is added here.
    # 'runtime: nvidia' is REQUIRED on Unraid (nvidia-driver plugin) for the GPU reservation below to attach.
    # This line was present in the live/deployed stack but missing from this file - added for parity.
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
                - compute
                - video
    volumes:
      # Photo upload storage
      # Changed this location to use the unraid share that will push from cashe to array or zpool
      # - immich-photos:/mnt/usr/immich/upload # Posible udpate if I need to hardcode for my photos to be stored on the protecetd zpool. 
      - immich-photos:/usr/src/app/upload # Original structure path 
      # Mount another folder location (as read only) of previous pictures from another network share. I will need to add the user/pass file to my unraid box. Techno Tim immich video for reference. 
      # /mnt/photos:/mnt/photos:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      # SECURITY: Immich has no network-layer auth gate. Consider
      # binding to a single interface instead of all of them, e.g. '<LAN_or_tailscale_IP>:2283:2283'.
      - '2283:2283'
    depends_on: # 'depends on' means that it doesnt start untill these services are running as it depends on these services
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
    networks:
      immich-net:
        ipv4_address: 172.19.0.10
    labels:
      net.unraid.docker.icon: 'https://raw.githubusercontent.com/imagegenius/templates/main/unraid/img/immich.png'
      net.unraid.docker.webui: http://[IP]:[PORT:2283]
      folder.view: immich
      net.unraid.docker.managed: 'composeman'

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    # Extends are taken out and the file: hwaccel.ml.yml info for cuda/nvidia is added here.
    # 'runtime: nvidia' is REQUIRED on Unraid for the -cuda image to reach the GPU - added for parity with live.
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu 
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false
    networks:
      immich-net:
        ipv4_address: 172.19.0.11
    labels:
      net.unraid.docker.icon: 'https://raw.githubusercontent.com/imagegenius/templates/main/unraid/img/immich.png'
      folder.view: immich
      net.unraid.docker.managed: 'composeman'

  redis:
    container_name: immich_redis
    # Upstream now defaults to valkey:9; valkey:8 below matches your running stack and is fine.
    # Redis/Valkey is only an ephemeral job cache for Immich, so the redis-data persist + 'public' exposure are low-risk (no published port).
    image: docker.io/valkey/valkey:8-bookworm@sha256:ff21bc0f8194dc9c105b769aeabf9585fea6a8ed649c0781caeac5cb3c247884
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      immich-net:
        ipv4_address: 172.19.0.12
    labels:
      net.unraid.docker.icon: 'https://raw.githubusercontent.com/A75G/docker-templates/master/templates/icons/redis.png'
      folder.view: immich
      net.unraid.docker.managed: 'composeman'

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3
    # Matches your LIVE DB (PG18, vchord 0.5.3, vector 0.8.1) - do NOT change the major version or the
    # /var/lib/postgresql/18/docker path without a full backup + dump/restore; doing so would orphan the DB.
    # Recommended: pin by digest for reproducibility. Capture the digest you're running with:
    #   docker inspect immich_postgres --format '{{index .RepoDigests 0}}'
    # then use  ...:18-vectorchord0.5.3@sha256:<digest>
    shm_size: 128mb            # Postgres needs >64MB shared mem for vacuum/parallel queries; upstream sets this. Restored here.
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    restart: always
    networks:
      immich-net:
        ipv4_address: 172.19.0.13
    labels:
      #original link didnt work for icon: https://raw.githubusercontent.com/A75G/docker-templates/master/templates/icons/postgres.png needs to be updated. 
      net.unraid.docker.icon: 'https://raw.githubusercontent.com/bmartino1/unraid-docker-templates/refs/heads/main/images/postgresql-immich-logo.png'
      folder.view: immich
      net.unraid.docker.managed: 'composeman'

networks:
  immich-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1

volumes:
  model-cache:
    driver: local
    driver_opts:
      type: none
      # Changeup the path for my unraid setup, this needs to be on the SSD or cache drive in unraid.
      device: /mnt/user/appdata_immich/immich/config
      o: bind

  immich-photos:
    driver: local
    driver_opts:
      type: none
      # Changeup the path for my unraid setup with secondary cashe drives and zpool for the photo storage.  
      # device: /mnt/user/appdata_immich/immich/photos # appdata_immich is the SSD cache drive.
      device: /mnt/user/immich/immich/photos # immich is the zpool HHD drives.
      o: bind

  postgres-data:
    driver: local
    driver_opts:
      type: none
      # Changeup the path for my unraid setup, this must to be on the SSD or cache drive in unraid for the DB.
      device: /mnt/user/appdata_immich/immich/database/postgres
      o: bind

  redis-data:
    driver: local
    driver_opts:
      type: none
      # Changeup the path for my unraid setup, this needs to be on the SSD or cache drive in unraid.
      device: /mnt/user/appdata_immich/immich/database/redis
      o: bind
